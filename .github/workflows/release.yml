name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (without the v prefix)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Package and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the package
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          dart pub publish --dry-run

      - name: Package the source
        run: |
          mkdir -p dist
          tar --exclude-vcs --exclude=build --exclude=dist \
            -czf "dist/app_updater-${{ steps.version.outputs.value }}.tar.gz" \
            lib example ci scripts README.md CHANGELOG.md LICENSE pubspec.yaml

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: app_updater v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*.tar.gz

  ci-server-image:
    name: Publish the CI server container
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ci/app_updater_ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-updater-ci:latest
            ghcr.io/${{ github.repository_owner }}/app-updater-ci:${{ github.ref_name }}
