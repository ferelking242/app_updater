name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

jobs:
  package:
    name: Analyze and test app_updater
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # `flutter analyze` walks the nested packages too, so their own
      # dependencies must be resolved first.
      - name: Install nested package dependencies
        run: |
          (cd example && flutter pub get)
          (cd ci/app_updater_ci && dart pub get)
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --reporter expanded

  ci-server:
    name: Analyze and test the CI server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci/app_updater_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded

  example:
    name: Build the example app (Android)
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Build APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: example-android-arm64
          path: example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
