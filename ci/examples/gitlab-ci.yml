# Copy to .gitlab-ci.yml of your Flutter app.
stages: [build, publish]

variables:
  APP_ID: my-app
  APP_UPDATER_CI_ENDPOINT: https://updates.example.com

build:android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - flutter pub get
    - flutter build apk --release --split-per-abi
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 30 days

publish:android:
  stage: publish
  image: alpine:3.20
  needs: [build:android]
  before_script:
    - apk add --no-cache curl python3 bash
  script:
    - curl -fsSL https://raw.githubusercontent.com/ferelking242/app_updater/main/scripts/publish-build.sh -o publish-build.sh
    - chmod +x publish-build.sh
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for FILE in build/app/outputs/flutter-apk/*.apk; do
        ABI=""
        case "$FILE" in
          *arm64-v8a*) ABI="arm64-v8a" ;;
          *armeabi-v7a*) ABI="armeabi-v7a" ;;
          *x86_64*) ABI="x86_64" ;;
        esac
        ./publish-build.sh --endpoint "$APP_UPDATER_CI_ENDPOINT" --app "$APP_ID" \
          --file "$FILE" --version "$VERSION" --build-number "$CI_PIPELINE_IID" \
          --platform android --channel stable ${ABI:+--abi "$ABI"}
      done
  rules:
    - if: $CI_COMMIT_TAG
